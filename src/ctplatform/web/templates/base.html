<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}箱动态数据平台{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">📦 箱动态数据平台 <span>Container Movement Platform</span></div>
  <nav>
    <a href="{{ url_for('dashboard') }}" {% if request.endpoint=='dashboard' %}class="active"{% endif %}>总览</a>
    <a href="{{ url_for('sources') }}" {% if request.endpoint in ('sources','source_detail') %}class="active"{% endif %}>数据源接入</a>
    <a href="{{ url_for('mappings') }}" {% if request.endpoint=='mappings' %}class="active"{% endif %}>映射规则</a>
    <a href="{{ url_for('movements') }}" {% if request.endpoint=='movements' %}class="active"{% endif %}>箱动态</a>
    <a href="{{ url_for('recon') }}" {% if request.endpoint=='recon' %}class="active"{% endif %}>对账差异</a>
    <a href="{{ url_for('lineage') }}" {% if request.endpoint=='lineage' %}class="active"{% endif %}>血缘</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash flash-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">Python + DuckDB + Flask · 原始报文留痕 · 字段级血缘 · 全量幂等重算</footer>
</body>
</html>
